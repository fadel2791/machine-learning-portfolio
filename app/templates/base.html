
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Machine Learning Portfolio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">M</span>
            <span>ML<span class="brand-light">Portfolio.</span></span>
        </a>

        <div class="nav-links">
            <a href="/" class="active">Home</a>
            <a href="#about">About</a>
            <a href="#practicum">Practicum</a>
            <a href="#contact">Contact</a>
        </div>

        <a href="#practicum" class="nav-button">Explore Portfolio ↗</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer id="contact">
        <div class="footer-brand">ML<span>Portfolio.</span></div>
        <p>Digital Machine Learning Portfolio · 2026</p>
        <span>Built with Python & Flask</span>
    </footer>

</body>
</html>
